name: Move Files to Docs

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare docs directory and move files
        run: |
          # Create the docs directory if it doesn't exist
          mkdir -p docs
          
          # Move everything EXCEPT the 'docs' folder and '.git' to 'docs/'
          # This prevents infinite loops or moving the git history
          find . -maxdepth 1 ! -name '.' ! -name 'docs' ! -name '.git' -exec mv -t docs/ {} +

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          # Check if there are changes to commit to avoid failing if already done
          if git diff-index --cached --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Move all repository files into docs folder"
            git push
          fi


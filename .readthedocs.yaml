version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    build:
      html:
        # 1. Ensure the target RTD directory structure exists
        - mkdir --parents $READTHEDOCS_OUTPUT/html/
        # 2. Copy all your raw HTML/CSS/JS files directly to it
        - cp --recursive docs/* $READTHEDOCS_OUTPUT/html/
